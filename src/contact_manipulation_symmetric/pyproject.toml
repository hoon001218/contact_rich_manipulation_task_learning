[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-manipulation-symmetric"
version = "0.0.1"
description = "Independent contact manipulation experiment with identical actor/critic observations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium", "numba>=0.59", "trimesh", "warp-lang"]

[tool.setuptools.packages.find]
include = ["contact_manipulation_symmetric*"]

[tool.setuptools.package-data]
contact_manipulation_symmetric = ["data/initial_scene_catalog/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
