[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-manipulation-parallel"
version = "0.0.1"
description = "Manager-based Isaac Lab shelf manipulation with native MLP actor and critic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium", "numba>=0.59", "trimesh", "warp-lang"]

[tool.setuptools.packages.find]
include = ["contact_manipulation_parallel*"]

[tool.setuptools.package-data]
contact_manipulation_parallel = ["data/initial_scene_catalog/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
